# Copy selected sections to ~/.logox/config.toml or .logox/config.toml.
# Use /login for credentials and /model for an available model ID.
[provider]
name = "openai-compatible"
model = ""
temperature = 0.2
thinking_effort = "auto"
max_tokens = 16384
timeout = 600 # Seconds without meaningful model progress.
# cache_retention = "long" # short or long; also under [providers.<name>] and [models."provider/model"]. Anthropic: 1h cache. OpenAI: only sent when set here.
# cache_ttl_seconds = 1800 # Seconds a gateway keeps a prompt cache entry (same places). When set it always wins. Unset: Anthropic uses the lifetime of cache_retention, everything else is unknown and treated as never expired.

[context]
keep_recent_rounds = 2
keep_recent_tools = 2
reserve_tokens = 32768
high_watermark_ratio = 0.8 # The high watermark is the larger of window minus reserve and this share of the window.
low_watermark_ratio = 0.5
# max_budget_tokens = 6000
# target_budget_tokens = 4000
# summary_provider = "work"
# summary_model = "your-model-id"

[automa]
max_parallel = 4 # Jobs run at once per dispatch (1-8); a dispatch may ask for more, up to 8.

[kernel]
max_iterations = 0 # Unlimited round trips; cancellation still applies.
max_retries = 3
cache_keepalive = true # Keep an idle actor's short prompt cache warm while it is certain to wake again.

[permissions]
mode = "auto" # auto (default), default, or creative; not an OS sandbox.
readonly_concurrency = 4

# Optional theme overrides.
# [theme]
# user = "#D77757"
# accent = "#7DA1DE"
# dream_collapsed = "#C9D3E4"
# dream_expanded = "#E4EAF5"

# Custom OpenAI-compatible service. Select it with /provider work.
# Do not save api_key in TOML; use api_key_env or /login.
# [providers.work]
# kind = "openai_compat"
# base_url = "https://example.com/v1"
# api_key_env = "WORK_MODEL_API_KEY"
# default_model = "your-model-id"
# Route some models of this provider through the Anthropic Messages protocol (same base_url, /messages).
# model_kinds = { "claude-*" = "anthropic" }

# Local service example; start the server and install its model separately.
# [providers.local]
# kind = "openai_compat"
# base_url = "http://127.0.0.1:11434/v1"
# default_model = "your-model-id"

# Declare the actual server allocation, not just the model's theoretical limit.
# [models."local/your-model-id"]
# context_window = 8192
# max_output_tokens = 2048

# Optional thinking capabilities and per-million-token prices.
# Only declare values supported by the selected service.
# [models."work/your-model-id"]
# context_window = 32768
# thinking_protocol = "reasoning-effort"
# thinking_levels = ["auto", "off", "low", "medium", "high"]
# [models."work/your-model-id".prices]
# currency = "USD"
# input = 2
# output = 4
# cache_read = 0.5
# cache_write = 3

# Custom gateway that serves models from a built-in catalog: declare the catalog it mirrors (and ids the catalog lacks)
# so context windows and prices resolve. See docs/modules/model-table.md.
# [catalogs.antigravity]
# mirror = "google"
# [catalogs.antigravity.aliases]
# "gemini-4-argon-high" = "gemini-4-argon"

# The bundled Playwright MCP server starts locally on first browser use.
# Prepare Chromium while online with: npm run browser:install
# [mcp]
# playwright = false # Disable the built-in browser server.

# Additional MCP servers use stdio subprocesses, not HTTP transport.
# [mcp.servers.local]
# command = "node"
# args = ["/absolute/path/to/server.mjs"]
# timeout = 30
# startup_timeout_s = 10
# enabled = true

# Observation hooks execute real commands. Review scripts before enabling.
# [hooks]
# enabled = true
# timeout_s = 5
# [[hooks.entries]]
# event = "post_tool_use"
# tool = "Read"
# command = "node"
# args = ["/absolute/path/to/observe.mjs"]
